  <line x1="56" y1="23" x2="56" y2="35" stroke="#ff6600" stroke-width="3" stroke-linecap="round"/>

  <!-- Tassel knot -->
  <circle cx="56" cy="37.5" r="3.5" fill="#ff6600"/>

  <!-- Tassel fringe -->
  <line x1="53" y1="41" x2="51.5" y2="47" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="41" x2="56"   y2="47" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="41" x2="60.5" y2="47" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
</svg>
